services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Browser uses same-origin HTTP. Nginx resolves the Docker service address.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      VITE_ADDRESS_BOUNDARY_BASE_URL: ${VITE_ADDRESS_BOUNDARY_BASE_URL:-https://tinhthanhpho.com/data}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
      BACKEND_URL: ${BACKEND_URL:-http://organic-backend:8088}
      NGINX_ENVSUBST_FILTER: ^BACKEND_URL$
    restart: unless-stopped
    networks:
      - shared

networks:
  shared:
    name: my-shared-network
    external: true
